{{- if .Values.dualPodsController.enabled }}
{{- if .Values.dualPodsController.coverage.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ .Release.Name }}-coverdata-dual-pods-controller"
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "fma-controllers.labels" . | nindent 4 }}
    app.kubernetes.io/component: dual-pods-controller
  name: "{{ .Release.Name }}-dual-pods-controller"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fma-controllers
      app.kubernetes.io/component: dual-pods-controller
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fma-controllers
        app.kubernetes.io/component: dual-pods-controller
        app.kubernetes.io/instance: {{ .Release.Name }}
        scrape: "true"
    spec:
      containers:
      - name: controller
        image: "{{ .Values.global.imageRegistry }}/dual-pods-controller:{{ .Values.global.imageTag }}"
        imagePullPolicy: {{ include "fma-controllers.dpc.imagePullPolicy" . }}
        command:
        - /ko-app/dual-pods-controller
        - "-v=5"
        - "--namespace={{ .Release.Namespace }}"
        - "--sleeper-limit={{ .Values.dualPodsController.sleeperLimit }}"
        - "--debug-accelerator-memory={{ .Values.dualPodsController.debugAcceleratorMemory }}"
        {{- if .Values.dualPodsController.coverage.enabled }}
        env:
        - name: GOCOVERDIR
          value: /var/coverdata
        {{- end }}
        ports:
        - containerPort: 8002
          name: metrics
          protocol: TCP
        {{- if .Values.dualPodsController.coverage.enabled }}
        volumeMounts:
        - name: coverdata
          mountPath: "/var/coverdata"
        {{- end }}
      serviceAccountName: {{ .Release.Name }}-fma-controllers
      {{- if .Values.dualPodsController.coverage.enabled }}
      volumes:
      - name: coverdata
        persistentVolumeClaim:
          claimName: "{{ .Release.Name }}-coverdata-dual-pods-controller"
      {{- end }}
{{- if .Values.dualPodsController.coverage.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "fma-controllers.labels" . | nindent 4 }}
    app.kubernetes.io/component: dpc-coverdata-inspector
  name: "{{ .Release.Name }}-dpc-coverdata-inspector"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fma-controllers
      app.kubernetes.io/component: dpc-coverdata-inspector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fma-controllers
        app.kubernetes.io/component: dpc-coverdata-inspector
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - name: inspector
        image: "{{ .Values.global.coverdataInspectorImage }}"
        imagePullPolicy: IfNotPresent
        command:
        - sleep
        - "86400"
        volumeMounts:
        - name: coverdata
          mountPath: "/var/coverdata"
      serviceAccountName: {{ .Release.Name }}-fma-controllers
      volumes:
      - name: coverdata
        persistentVolumeClaim:
          claimName: "{{ .Release.Name }}-coverdata-dual-pods-controller"
{{- end }}
{{- end }}
